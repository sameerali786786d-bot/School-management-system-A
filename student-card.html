<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID - Al Bilawal Soomro Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; min-height: 100vh; font-family: Inter, system-ui, sans-serif; }
    .card-wrap { max-width: 420px; margin: 1.5rem auto; }
    .profile-card {
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .profile-header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff; padding: 1.25rem; text-align: center;
    }
    .profile-header img.logo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #fff; }
    .photo-wrap {
      width: 120px; height: 120px; border-radius: 50%; margin: -40px auto 0;
      border: 4px solid #fff; overflow: hidden; background: #e2e8f0;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .photo-wrap .initials {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 700; color: #1e40af; background: #dbeafe;
    }
    .detail-row { display: flex; justify-content: space-between; padding: .45rem 0; border-bottom: 1px solid #f1f5f9; font-size: .9rem; }
    .detail-row .label { color: #64748b; }
    .detail-row .value { font-weight: 600; color: #0f172a; text-align: right; max-width: 60%; }
    .err { color: #fff; text-align: center; padding: 3rem 1rem; }
  </style>
</head>
<body>
  <div class="card-wrap" id="app">
    <div class="text-center text-white py-5"><div class="spinner-border"></div><p class="mt-2">Loading...</p></div>
  </div>
  <script src="js/storage.js"></script>
  <script>
    function qs(name) {
      return new URLSearchParams(location.search).get(name);
    }
    function getLogo() {
      try {
        const l = localStorage.getItem('smps_schoolLogo');
        if (l) return l;
      } catch (e) {}
      return 'assets/images/logo.jpg';
    }
    function findStudent(id) {
      try {
        if (typeof Storage !== 'undefined' && Storage.getAll) {
          const list = Storage.getAll('students') || [];
          return list.find(s => s.id === id) || null;
        }
      } catch (e) {}
      try {
        const raw = localStorage.getItem('smps_students');
        if (raw) {
          const list = JSON.parse(raw);
          return (list || []).find(s => s.id === id) || null;
        }
      } catch (e) {}
      return null;
    }
    function className(id) {
      try {
        const classes = (typeof Storage !== 'undefined' && Storage.getAll) ? Storage.getAll('classes') : JSON.parse(localStorage.getItem('smps_classes') || '[]');
        const c = (classes || []).find(x => x.id === id);
        return c ? c.name : (id || '-');
      } catch (e) { return '-'; }
    }
    function photoHtml(s) {
      if (s.photo) return '<img src="' + s.photo + '" alt="Photo">';
      const ch = (s.fullName || 'S').charAt(0).toUpperCase();
      return '<div class="initials">' + ch + '</div>';
    }
    function renderFromPayload(p) {
      return renderCard({
        fullName: p.n || p.fullName || '-',
        admissionNo: p.a || p.admissionNo || '-',
        classId: p.c || '',
        classLabel: p.cl || p.className || '-',
        section: p.sec || p.section || '-',
        rollNo: p.r || p.rollNo || '-',
        gender: p.g || p.gender || '-',
        dob: p.dob || '-',
        bloodGroup: p.bg || p.bloodGroup || '-',
        phone: p.ph || p.phone || '-',
        fatherName: p.f || p.fatherName || '-',
        motherName: p.m || p.motherName || '-',
        address: p.ad || p.address || '-',
        photo: p.photo || null,
        status: p.st || 'active'
      });
    }
    function renderCard(s) {
      const cls = s.classLabel || className(s.classId);
      return `
      <div class="profile-card">
        <div class="profile-header">
          <img class="logo" src="${getLogo()}" alt="Logo" onerror="this.style.display='none'">
          <div class="fw-bold mt-2" style="font-size:.95rem;">Al Bilawal Soomro Public School</div>
          <div style="opacity:.85;font-size:.8rem;">Student Identity Card</div>
        </div>
        <div class="photo-wrap">${photoHtml(s)}</div>
        <div class="text-center px-3 pt-2 pb-1">
          <h5 class="mb-0">${s.fullName || '-'}</h5>
          <span class="badge bg-${s.status === 'active' ? 'success' : 'secondary'} mt-1">${s.status || 'active'}</span>
        </div>
        <div class="px-3 pb-3">
          <div class="detail-row"><span class="label">Admission No</span><span class="value">${s.admissionNo || '-'}</span></div>
          <div class="detail-row"><span class="label">Class</span><span class="value">${cls}</span></div>
          <div class="detail-row"><span class="label">Section</span><span class="value">${s.section || '-'}</span></div>
          <div class="detail-row"><span class="label">Roll No</span><span class="value">${s.rollNo || '-'}</span></div>
          <div class="detail-row"><span class="label">Gender</span><span class="value">${s.gender || '-'}</span></div>
          <div class="detail-row"><span class="label">Date of Birth</span><span class="value">${s.dob || '-'}</span></div>
          <div class="detail-row"><span class="label">Blood Group</span><span class="value">${s.bloodGroup || '-'}</span></div>
          <div class="detail-row"><span class="label">Father</span><span class="value">${s.fatherName || '-'}</span></div>
          <div class="detail-row"><span class="label">Mother</span><span class="value">${s.motherName || '-'}</span></div>
          <div class="detail-row"><span class="label">Phone</span><span class="value">${s.phone || '-'}</span></div>
          <div class="detail-row"><span class="label">Address</span><span class="value">${s.address || '-'}</span></div>
        </div>
        <div class="text-center text-muted small pb-3">Scan verified • Al Bilawal Soomro Public School</div>
      </div>`;
    }

    (function() {
      const id = qs('id');
      const dataParam = qs('d');
      const app = document.getElementById('app');

      if (dataParam) {
        try {
          const json = decodeURIComponent(escape(atob(dataParam.replace(/-/g, '+').replace(/_/g, '/'))));
          const payload = JSON.parse(json);
          app.innerHTML = renderFromPayload(payload);
          return;
        } catch (e) {
          console.warn(e);
        }
      }

      if (!id) {
        app.innerHTML = '<div class="err"><i class="fas fa-qrcode fa-3x mb-3"></i><h5>Invalid QR / Link</h5><p>Student ID missing.</p></div>';
        return;
      }

      const s = findStudent(id);
      if (!s) {
        app.innerHTML = `<div class="err">
          <i class="fas fa-user-slash fa-3x mb-3"></i>
          <h5>Student not found</h5>
          <p class="small opacity-75">ID: ${id}<br>Open this on the school device where data is saved, or use a freshly generated ID card QR.</p>
        </div>`;
        return;
      }
      app.innerHTML = renderCard(s);
    })();
  </script>
</body>
</html>
