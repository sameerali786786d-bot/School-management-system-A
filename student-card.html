<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID - Al Bilawal Soomro Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(160deg, #0b3a6e 0%, #0ea5e9 100%);
      font-family: Inter, system-ui, sans-serif;
      padding: 1.25rem;
    }
    .wrap { max-width: 400px; margin: 0 auto; }
    .card {
      background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }
    .head {
      background: #0b3a6e; color: #fff; text-align: center; padding: 1.25rem 1rem 2.5rem;
      position: relative;
    }
    .head img.logo {
      width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #fff;
    }
    .head .school {
      margin-top: 8px; font-weight: 800; font-size: 1.05rem; color: #fb923c;
      text-transform: uppercase; line-height: 1.25;
    }
    .head .tag { font-size: .7rem; color: #93c5fd; letter-spacing: .08em; }
    .wave {
      position: absolute; left: 0; right: 0; bottom: -1px; height: 40px;
      background: #fff; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .photo {
      width: 120px; height: 120px; margin: -20px auto 0; border-radius: 14px;
      border: 4px solid #0b3a6e; overflow: hidden; background: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; font-weight: 800; color: #0b3a6e;
      box-shadow: 0 6px 16px rgba(11,58,110,.25);
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .body { padding: 12px 1.25rem 1.5rem; text-align: center; }
    .name { font-size: 1.25rem; font-weight: 800; text-transform: uppercase; color: #0f172a; margin: 10px 0 2px; }
    .role { font-size: .75rem; letter-spacing: .15em; color: #64748b; font-weight: 600; margin-bottom: 14px; }
    .rows { text-align: left; }
    .row {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: .9rem;
    }
    .row .l { color: #64748b; }
    .row .v { font-weight: 600; color: #0f172a; text-align: right; }
    .err { color: #fff; text-align: center; padding: 3rem 1rem; }
    .foot { text-align: center; color: rgba(255,255,255,.85); font-size: .75rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="text-center text-white py-5"><div class="spinner-border"></div><p class="mt-2">Loading student...</p></div>
  </div>
  <script src="js/storage.js"></script>
  <script>
    function qs(n) { return new URLSearchParams(location.search).get(n); }
    function getLogo() {
      try { const l = localStorage.getItem('smps_schoolLogo'); if (l) return l; } catch (e) {}
      return 'assets/images/logo.jpg';
    }
    function findStudent(id) {
      try {
        if (typeof Storage !== 'undefined' && Storage.getAll) {
          return (Storage.getAll('students') || []).find(s => s.id === id) || null;
        }
      } catch (e) {}
      try {
        const list = JSON.parse(localStorage.getItem('smps_students') || '[]');
        return (list || []).find(s => s.id === id) || null;
      } catch (e) {}
      return null;
    }
    function className(id) {
      try {
        let classes = [];
        if (typeof Storage !== 'undefined' && Storage.getAll) classes = Storage.getAll('classes') || [];
        else classes = JSON.parse(localStorage.getItem('smps_classes') || '[]');
        const c = (classes || []).find(x => x.id === id);
        return c ? c.name : '-';
      } catch (e) { return '-'; }
    }
    function render(s) {
      const photo = s.photo
        ? '<img src="' + s.photo + '" alt="Photo">'
        : '<span>' + (s.fullName || 'S').charAt(0).toUpperCase() + '</span>';
      const cls = s.classLabel || s.className || className(s.classId) || '-';
      document.getElementById('app').innerHTML = `
        <div class="card">
          <div class="head">
            <img class="logo" src="${getLogo()}" alt="Logo" onerror="this.style.display='none'">
            <div class="school">Al Bilawal Soomro Public School</div>
            <div class="tag">QUEST FOR EXCELLENCE</div>
            <div class="wave"></div>
          </div>
          <div class="photo">${photo}</div>
          <div class="body">
            <div class="name">${s.fullName || '-'}</div>
            <div class="role">STUDENT</div>
            <div class="rows">
              <div class="row"><span class="l">Admission No</span><span class="v">${s.admissionNo || '-'}</span></div>
              <div class="row"><span class="l">Class</span><span class="v">${cls}</span></div>
              <div class="row"><span class="l">Section</span><span class="v">${s.section || '-'}</span></div>
              <div class="row"><span class="l">Roll No</span><span class="v">${s.rollNo || '-'}</span></div>
              <div class="row"><span class="l">Gender</span><span class="v">${s.gender || '-'}</span></div>
              <div class="row"><span class="l">Date of Birth</span><span class="v">${s.dob || '-'}</span></div>
              <div class="row"><span class="l">Blood Group</span><span class="v">${s.bloodGroup || '-'}</span></div>
              <div class="row"><span class="l">Father</span><span class="v">${s.fatherName || '-'}</span></div>
              <div class="row"><span class="l">Mother</span><span class="v">${s.motherName || '-'}</span></div>
              <div class="row"><span class="l">Phone</span><span class="v">${s.phone || '-'}</span></div>
              <div class="row"><span class="l">Email</span><span class="v">${s.email || '-'}</span></div>
              <div class="row"><span class="l">Address</span><span class="v">${s.address || '-'}</span></div>
            </div>
          </div>
        </div>
        <div class="foot">Verified Student ID • Al Bilawal Soomro Public School</div>`;
    }
    function fromPayload(p) {
      return {
        fullName: p.n || p.fullName,
        admissionNo: p.a || p.admissionNo,
        classLabel: p.cl || p.className,
        section: p.sec || p.section,
        rollNo: p.r || p.rollNo,
        gender: p.g || p.gender,
        dob: p.dob,
        bloodGroup: p.bg || p.bloodGroup,
        phone: p.ph || p.phone,
        email: p.em || p.email,
        fatherName: p.f || p.fatherName,
        motherName: p.m || p.motherName,
        address: p.ad || p.address,
        photo: p.photo || null,
        status: p.st || 'active'
      };
    }
    (function () {
      const id = qs('id');
      const d = qs('d');
      if (d) {
        try {
          const b64 = d.replace(/-/g, '+').replace(/_/g, '/');
          const json = decodeURIComponent(escape(atob(b64)));
          const payload = JSON.parse(json);
          let s = fromPayload(payload);
          // merge photo from local storage if available
          if (id) {
            const local = findStudent(id);
            if (local) {
              s = Object.assign({}, s, local);
              if (local.photo) s.photo = local.photo;
            }
          }
          render(s);
          return;
        } catch (e) { console.warn(e); }
      }
      if (!id) {
        document.getElementById('app').innerHTML = '<div class="err"><h5>Invalid QR</h5><p>Student ID missing.</p></div>';
        return;
      }
      const s = findStudent(id);
      if (!s) {
        document.getElementById('app').innerHTML = '<div class="err"><h5>Student not found</h5><p>Open QR from a freshly generated ID card, or use the school device where data is saved.</p></div>';
        return;
      }
      render(s);
    })();
  </script>
</body>
</html>
