<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Al Bilawal Soomro Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
  <style>
    .id-card {
      width: 320px; border-radius: 12px; overflow: hidden;
      border: 1px solid #cbd5e1; background: #fff;
      font-family: Inter, system-ui, sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .id-card-header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff; padding: 10px 12px; text-align: center;
    }
    .id-card-header img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #fff; }
    .id-card-body { padding: 12px; display: flex; gap: 12px; }
    .id-photo {
      width: 88px; height: 110px; border-radius: 8px; overflow: hidden;
      background: #e2e8f0; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #1e40af;
    }
    .id-photo img { width: 100%; height: 100%; object-fit: cover; }
    .id-info { flex: 1; font-size: 0.78rem; line-height: 1.45; }
    .id-info .name { font-size: 0.95rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .id-info div span { color: #64748b; }
    .id-card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-top: 1px solid #e2e8f0; background: #f8fafc;
    }
    .id-card-footer canvas, .id-card-footer img { width: 72px; height: 72px; }
    .id-card-footer .scan-text { font-size: 0.65rem; color: #64748b; max-width: 160px; }
    @media print {
      body * { visibility: hidden !important; }
      #idCardModal, #idCardModal * { visibility: visible !important; }
      #idCardModal { position: fixed; left: 0; top: 0; margin: 0; padding: 0; }
      .modal-backdrop, .no-print { display: none !important; }
      .modal { position: static !important; }
      .modal-dialog { max-width: none !important; margin: 0 !important; }
      .modal-content { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Students</h1>
            <p class="text-muted mb-0 small">Manage student records</p>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-secondary btn-sm" id="exportStudents"><i class="fas fa-download me-1"></i>Export CSV</button>
            <button class="btn btn-primary btn-sm" id="btnAddStudent" data-perm="students"><i class="fas fa-plus me-1"></i>Add Student</button>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-4">
                <input type="search" class="form-control" id="searchStudent" placeholder="Search by name, admission no...">
              </div>
              <div class="col-md-2">
                <select class="form-select" id="filterClass">
                  <option value="">All Classes</option>
                </select>
              </div>
              <div class="col-md-2">
                <select class="form-select" id="filterGender">
                  <option value="">All Genders</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
              <div class="col-md-2">
                <select class="form-select" id="filterStatus">
                  <option value="">All Status</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle" id="studentsTable">
                <thead>
                  <tr>
                    <th>Adm No</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Section</th>
                    <th>Roll</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Contact</th>
                    <th>Status</th>
                    <th class="no-print">Actions</th>
                  </tr>
                </thead>
                <tbody id="studentsBody"></tbody>
              </table>
            </div>
            <div id="studentsEmpty" class="empty-state d-none">
              <i class="fas fa-user-graduate"></i>
              <h5>No students found</h5>
              <p>Add your first student to get started.</p>
              <button class="btn btn-primary btn-sm" id="btnAddStudentEmpty"><i class="fas fa-plus me-1"></i>Add Student</button>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3" id="paginationArea">
              <small class="text-muted" id="pageInfo"></small>
              <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="studentModalTitle">Add Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="studentForm">
          <div class="modal-body">
            <input type="hidden" id="studentId">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="fullName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Father's Name *</label>
                <input type="text" class="form-control" id="fatherName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mother's Name</label>
                <input type="text" class="form-control" id="motherName">
              </div>
              <div class="col-md-6">
                <label class="form-label">Date of Birth *</label>
                <input type="date" class="form-control" id="dob" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Gender *</label>
                <select class="form-select" id="gender" required>
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Class *</label>
                <select class="form-select" id="classId" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Section *</label>
                <select class="form-select" id="section" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Roll Number</label>
                <input type="text" class="form-control" id="rollNo">
              </div>
              <div class="col-md-4">
                <label class="form-label">Phone *</label>
                <input type="tel" class="form-control" id="phone" required placeholder="03XXXXXXXXX">
              </div>
              <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email">
              </div>
              <div class="col-md-8">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" id="address">
              </div>
              <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" class="form-control" id="city" value="Qamber">
              </div>
              <div class="col-md-4">
                <label class="form-label">Blood Group</label>
                <select class="form-select" id="bloodGroup">
                  <option value="">Select</option>
                  <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                  <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Admission Date</label>
                <input type="date" class="form-control" id="admissionDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Status</label>
                <select class="form-select" id="status">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Previous School</label>
                <input type="text" class="form-control" id="previousSchool">
              </div>
              <div class="col-md-6">
                <label class="form-label">Emergency Contact</label>
                <input type="tel" class="form-control" id="emergencyContact">
              </div>
              <div class="col-12">
                <label class="form-label">Student Photo (for ID Card)</label>
                <input type="file" class="form-control" id="studentPhoto" accept="image/*">
                <div class="mt-2 d-flex align-items-center gap-2">
                  <img id="studentPhotoPreview" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;display:none;border:1px solid #e2e8f0;">
                  <button type="button" class="btn btn-sm btn-outline-danger" id="clearStudentPhoto" style="display:none;">Remove Photo</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveStudentBtn">Save Student</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <!-- ID Card Modal -->
  <div class="modal fade" id="idCardModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header no-print">
          <h5 class="modal-title">Student ID Card</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body d-flex justify-content-center" id="idCardBody"></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-outline-primary" id="printIdCard"><i class="fas fa-print me-1"></i>Print</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal fade" id="viewStudentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Student Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="viewStudentBody"></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-dark" id="viewIdCardBtn"><i class="fas fa-id-card me-1"></i>ID Card</button>
          <button type="button" class="btn btn-outline-secondary" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/students.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      App.ensureConfirmModal();
      Students.init();
    });
  </script>
</body>
</html>
