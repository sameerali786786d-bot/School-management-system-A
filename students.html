<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Al Bilawal Soomro Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
  <style>
    .id-card-set { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; padding: 8px; }
    .sid-card {
      width: 300px; height: 460px; border-radius: 12px; overflow: hidden;
      background: #fff; box-shadow: 0 10px 30px rgba(15,23,42,.15);
      font-family: Inter, system-ui, sans-serif; position: relative;
      display: flex; flex-direction: column;
    }
    /* FRONT */
    .sid-front-header {
      background: #0b3a6e; color: #fff; text-align: center;
      padding: 16px 14px 48px; position: relative;
    }
    .sid-front-header .logo-row {
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px;
    }
    .sid-front-header .logo-row img {
      width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #fff;
    }
    .sid-front-header .school {
      font-weight: 800; font-size: 0.95rem; color: #f97316; letter-spacing: .02em;
      line-height: 1.2; text-transform: uppercase;
    }
    .sid-front-header .tagline {
      font-size: 0.65rem; color: #93c5fd; letter-spacing: .08em;
    }
    .sid-wave-top {
      position: absolute; left: 0; right: 0; bottom: -2px; height: 56px;
      background: #fff;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .sid-wave-accent {
      position: absolute; left: 0; right: 0; bottom: 20px; height: 28px;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0.9;
    }
    .sid-front-body {
      flex: 1; background: #fff; text-align: center;
      padding: 0 18px 12px; display: flex; flex-direction: column; align-items: center;
    }
    .sid-photo {
      width: 110px; height: 110px; border-radius: 12px; overflow: hidden;
      border: 3px solid #0b3a6e; margin-top: -8px; background: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 700; color: #0b3a6e;
      box-shadow: 0 4px 12px rgba(11,58,110,.2);
    }
    .sid-photo img { width: 100%; height: 100%; object-fit: cover; }
    .sid-name {
      margin-top: 12px; font-weight: 800; font-size: 1.15rem; color: #0f172a;
      text-transform: uppercase; letter-spacing: .03em;
    }
    .sid-role {
      font-size: 0.72rem; font-weight: 600; color: #64748b; letter-spacing: .12em;
      margin-top: 2px; margin-bottom: 10px;
    }
    .sid-details { width: 100%; text-align: left; font-size: 0.78rem; }
    .sid-details div { margin-bottom: 4px; color: #334155; }
    .sid-details strong { color: #0b3a6e; font-weight: 600; min-width: 52px; display: inline-block; }
    .sid-front-footer {
      height: 36px; background: #0b3a6e; position: relative;
    }
    .sid-front-footer::before {
      content: ''; position: absolute; left: 0; right: 0; top: -18px; height: 28px;
      background: #0b3a6e;
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
    }
    /* BACK */
    .sid-back-top {
      background: #0b3a6e; flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px 16px 60px;
      position: relative; color: #fff;
    }
    .sid-qr-box {
      background: #fff; padding: 10px; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .sid-qr-box canvas, .sid-qr-box img { display: block; width: 140px !important; height: 140px !important; }
    .sid-back-label {
      margin-top: 14px; font-weight: 700; letter-spacing: .15em; font-size: 0.8rem;
    }
    .sid-wave-back {
      position: absolute; left: 0; right: 0; bottom: -2px; height: 50px;
      background: #fff;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .sid-wave-back-accent {
      position: absolute; left: 0; right: 0; bottom: 16px; height: 24px;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .sid-back-bottom {
      background: #fff; padding: 20px 18px 16px; text-align: center;
    }
    .sid-back-bottom h6 {
      font-size: 0.8rem; font-weight: 700; color: #0b3a6e; margin-bottom: 6px;
    }
    .sid-back-bottom p {
      font-size: 0.65rem; color: #64748b; line-height: 1.4; margin-bottom: 8px;
    }
    .sid-badge {
      display: inline-block; background: #0b3a6e; color: #fff;
      font-size: 0.65rem; padding: 3px 10px; border-radius: 20px; margin-top: 4px;
    }
    .sid-label-tag {
      position: absolute; top: 8px; left: 8px; z-index: 5;
      background: rgba(255,255,255,.2); color: #fff; font-size: 0.6rem;
      padding: 2px 8px; border-radius: 8px;
    }
    @media print {
      body * { visibility: hidden !important; }
      #idCardModal, #idCardModal * { visibility: visible !important; }
      #idCardModal { position: fixed; left: 0; top: 0; }
      .modal-backdrop, .no-print { display: none !important; }
      .modal { position: static !important; }
      .modal-dialog { max-width: none !important; margin: 0 !important; }
      .modal-content { border: none !important; box-shadow: none !important; }
      .sid-card { box-shadow: none; border: 1px solid #cbd5e1; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Students</h1>
            <p class="text-muted mb-0 small">Manage student records</p>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-secondary btn-sm" id="exportStudents"><i class="fas fa-download me-1"></i>Export CSV</button>
            <button class="btn btn-primary btn-sm" id="btnAddStudent" data-perm="students"><i class="fas fa-plus me-1"></i>Add Student</button>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-4">
                <input type="search" class="form-control" id="searchStudent" placeholder="Search by name, admission no...">
              </div>
              <div class="col-md-2">
                <select class="form-select" id="filterClass">
                  <option value="">All Classes</option>
                </select>
              </div>
              <div class="col-md-2">
                <select class="form-select" id="filterGender">
                  <option value="">All Genders</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
              <div class="col-md-2">
                <select class="form-select" id="filterStatus">
                  <option value="">All Status</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle" id="studentsTable">
                <thead>
                  <tr>
                    <th>Adm No</th>
                    <th>Name</th>
                    <th>Class</th>
                    <th>Section</th>
                    <th>Roll</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Contact</th>
                    <th>Status</th>
                    <th class="no-print">Actions</th>
                  </tr>
                </thead>
                <tbody id="studentsBody"></tbody>
              </table>
            </div>
            <div id="studentsEmpty" class="empty-state d-none">
              <i class="fas fa-user-graduate"></i>
              <h5>No students found</h5>
              <p>Add your first student to get started.</p>
              <button class="btn btn-primary btn-sm" id="btnAddStudentEmpty"><i class="fas fa-plus me-1"></i>Add Student</button>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3" id="paginationArea">
              <small class="text-muted" id="pageInfo"></small>
              <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="studentModalTitle">Add Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="studentForm">
          <div class="modal-body">
            <input type="hidden" id="studentId">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="fullName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Father's Name *</label>
                <input type="text" class="form-control" id="fatherName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mother's Name</label>
                <input type="text" class="form-control" id="motherName">
              </div>
              <div class="col-md-6">
                <label class="form-label">Date of Birth *</label>
                <input type="date" class="form-control" id="dob" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Gender *</label>
                <select class="form-select" id="gender" required>
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Class *</label>
                <select class="form-select" id="classId" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Section *</label>
                <select class="form-select" id="section" required></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Roll Number</label>
                <input type="text" class="form-control" id="rollNo">
              </div>
              <div class="col-md-4">
                <label class="form-label">Phone *</label>
                <input type="tel" class="form-control" id="phone" required placeholder="03XXXXXXXXX">
              </div>
              <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email">
              </div>
              <div class="col-md-8">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" id="address">
              </div>
              <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" class="form-control" id="city" value="Qamber">
              </div>
              <div class="col-md-4">
                <label class="form-label">Blood Group</label>
                <select class="form-select" id="bloodGroup">
                  <option value="">Select</option>
                  <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                  <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Admission Date</label>
                <input type="date" class="form-control" id="admissionDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Status</label>
                <select class="form-select" id="status">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Previous School</label>
                <input type="text" class="form-control" id="previousSchool">
              </div>
              <div class="col-md-6">
                <label class="form-label">Emergency Contact</label>
                <input type="tel" class="form-control" id="emergencyContact">
              </div>
              <div class="col-12">
                <label class="form-label">Student Photo (for ID Card)</label>
                <input type="file" class="form-control" id="studentPhoto" accept="image/*">
                <div class="mt-2 d-flex align-items-center gap-2">
                  <img id="studentPhotoPreview" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;display:none;border:1px solid #e2e8f0;">
                  <button type="button" class="btn btn-sm btn-outline-danger" id="clearStudentPhoto" style="display:none;">Remove Photo</button>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveStudentBtn">Save Student</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <!-- ID Card Modal -->
  <div class="modal fade" id="idCardModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header no-print">
          <h5 class="modal-title">Student ID Card</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body d-flex justify-content-center" id="idCardBody"></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-outline-primary" id="printIdCard"><i class="fas fa-print me-1"></i>Print</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal fade" id="viewStudentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Student Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="viewStudentBody"></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-dark" id="viewIdCardBtn"><i class="fas fa-id-card me-1"></i>ID Card</button>
          <button type="button" class="btn btn-outline-secondary" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/students.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      App.ensureConfirmModal();
      Students.init();
    });
  </script>
</body>
</html>
