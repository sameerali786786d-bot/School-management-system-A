<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1>Dashboard</h1>
            <p class="text-muted mb-0 small" id="welcomeText">Welcome back</p>
          </div>
          <div class="text-muted small" id="currentDate"></div>
        </div>

        <!-- Stat Cards -->
        <div class="row g-3 mb-4" id="statCards">
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon blue"><i class="fas fa-user-graduate"></i></div>
              <div class="stat-info">
                <h3 id="statStudents">0</h3>
                <p>Total Students</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon green"><i class="fas fa-chalkboard-teacher"></i></div>
              <div class="stat-info">
                <h3 id="statTeachers">0</h3>
                <p>Total Teachers</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon purple"><i class="fas fa-users"></i></div>
              <div class="stat-info">
                <h3 id="statStaff">0</h3>
                <p>Total Staff</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon orange"><i class="fas fa-school"></i></div>
              <div class="stat-info">
                <h3 id="statClasses">0</h3>
                <p>Total Classes</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon cyan"><i class="fas fa-user-check"></i></div>
              <div class="stat-info">
                <h3 id="statPresent">0</h3>
                <p>Present Today</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon red"><i class="fas fa-user-times"></i></div>
              <div class="stat-info">
                <h3 id="statAbsent">0</h3>
                <p>Absent Today</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon green"><i class="fas fa-money-bill-wave"></i></div>
              <div class="stat-info">
                <h3 id="statCollected">0</h3>
                <p>Fee Collected</p>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-4 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon orange"><i class="fas fa-exclamation-circle"></i></div>
              <div class="stat-info">
                <h3 id="statPending">0</h3>
                <p>Pending Fees</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-3 mb-4">
          <div class="col-lg-4">
            <div class="card h-100">
              <div class="card-header">Student Statistics (Gender)</div>
              <div class="card-body">
                <div class="chart-container"><canvas id="genderChart"></canvas></div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card h-100">
              <div class="card-header">Today's Attendance</div>
              <div class="card-body">
                <div class="chart-container"><canvas id="attendanceChart"></canvas></div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card h-100">
              <div class="card-header">Fee Collection Status</div>
              <div class="card-body">
                <div class="chart-container"><canvas id="feeChart"></canvas></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Notices & Upcoming -->
        <div class="row g-3">
          <div class="col-lg-6">
            <div class="card">
              <div class="card-header">
                <span>Latest Notices</span>
                <a href="notices.html" class="btn btn-sm btn-outline-primary">View All</a>
              </div>
              <div class="card-body p-0" id="noticesList"></div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card">
              <div class="card-header">
                <span>Upcoming Exams</span>
                <a href="exams.html" class="btn btn-sm btn-outline-primary">View All</a>
              </div>
              <div class="card-body p-0" id="examsList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      App.ensureConfirmModal();
      Dashboard.init();
    });
  </script>
</body>
</html>
