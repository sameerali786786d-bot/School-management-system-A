<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Al Bilawal Soomro Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1e40af; --primary-dark: #1e3a8a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    .login-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 40%, #3b82f6 100%);
      padding: 16px;
    }
    .login-card {
      background: #fff; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25);
      width: 100%; max-width: 420px; overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #1e3a8a, #1e40af); color: #fff;
      padding: 24px; text-align: center;
    }
    .login-header h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; }
    .login-header p { margin: 0; opacity: .85; font-size: .85rem; }
    .login-body { padding: 24px; }

    .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .btn-primary { background: #1e40af; border-color: #1e40af; }
    .btn-primary:hover { background: #1e3a8a; border-color: #1e3a8a; }
  
    .whatsapp-float {
      position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px;
      background: #25d366; color: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem; box-shadow: 0 4px 14px rgba(37,211,102,.45);
      z-index: 1060; text-decoration: none;
    }
    .whatsapp-float:hover { color: #fff; transform: scale(1.08); }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="mb-2" style="width:72px;height:72px;margin:0 auto;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);">
          <img id="loginLogo" src="assets/images/logo.jpg" alt="School Logo" style="width:72px;height:72px;object-fit:cover;border-radius:50%;">
        </div>
        <h1>Al Bilawal Soomro Public School</h1>
        <p>School Management System</p>
      </div>
      <div class="login-body">
        <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>
        <div id="loginSuccess" class="alert alert-success py-2 small d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="username">Username / Email</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
              <input type="text" class="form-control" id="username" placeholder="admin" autocomplete="username">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" placeholder="bilal1234*" autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a href="#" class="small text-decoration-none" id="forgotPassword">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
        </form>
      </div>
    </div>
  </div>
    </div>
  </div>

  <script>
    // Self-contained login - works even if other JS files fail to load
    (function () {
      var PREFIX = 'smps_';
      var DEMO_USERS = [
        { id: 'u1', username: 'admin', email: 'admin@smartschool.pk', password: 'bilal1234*', role: 'admin', name: 'System Administrator', phone: '03267029939' },
        { id: 'u2', username: 'principal', email: 'principal@smartschool.pk', password: 'principal123', role: 'principal', name: 'Dr. Muhammad Ali Khan' },
        { id: 'u3', username: 'teacher1', email: 'teacher@smartschool.pk', password: 'teacher123', role: 'teacher', name: 'Mrs. Fatima Zahra' },
        { id: 'u4', username: 'accountant', email: 'accounts@smartschool.pk', password: 'account123', role: 'accountant', name: 'Mr. Bilal Ahmed' },
        { id: 'u5', username: 'staff1', email: 'staff@smartschool.pk', password: 'staff123', role: 'staff', name: 'Mr. Imran Shah' }
      ];

      function showError(msg) {
        var el = document.getElementById('loginError');
        var ok = document.getElementById('loginSuccess');
        if (ok) ok.classList.add('d-none');
        if (el) {
          el.textContent = msg;
          el.classList.remove('d-none');
        } else {
          alert(msg);
        }
      }

      function showSuccess(msg) {
        var el = document.getElementById('loginSuccess');
        var err = document.getElementById('loginError');
        if (err) err.classList.add('d-none');
        if (el) {
          el.textContent = msg;
          el.classList.remove('d-none');
        }
      }

      function hideMessages() {
        var err = document.getElementById('loginError');
        var ok = document.getElementById('loginSuccess');
        if (err) err.classList.add('d-none');
        if (ok) ok.classList.add('d-none');
      }

      function getUsers() {
        try {
          var raw = localStorage.getItem(PREFIX + 'users');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) {
              var admin = parsed.find(function(u) { return u.username === 'admin'; });
              if (admin) admin.password = 'bilal1234*';
              var hasTeacher = parsed.some(function(u) { return u.role === 'teacher'; });
              if (!hasTeacher) {
                var t = DEMO_USERS.find(function(u) { return u.role === 'teacher'; });
                if (t) parsed.push(t);
              }
              try { localStorage.setItem(PREFIX + 'users', JSON.stringify(parsed)); } catch (e) {}
              return parsed;
            }
          }
        } catch (e) {}
        try {
          localStorage.setItem(PREFIX + 'users', JSON.stringify(DEMO_USERS));
        } catch (e) {}
        return DEMO_USERS;
      }

      
      function recordLoginHistory(user) {
        try {
          var entry = {
            username: user.username,
            name: user.name,
            role: user.role,
            loginAt: new Date().toISOString(),
            device: (navigator.userAgent || '').substring(0, 80)
          };
          localStorage.setItem('smps_lastLogin', JSON.stringify(entry));
          var hist = [];
          try { hist = JSON.parse(localStorage.getItem('smps_loginHistory') || '[]'); } catch(e) {}
          if (!Array.isArray(hist)) hist = [];
          hist.unshift(entry);
          if (hist.length > 30) hist = hist.slice(0, 30);
          localStorage.setItem('smps_loginHistory', JSON.stringify(hist));
        } catch (e) {}
      }

      function doLogin(username, password, remember) {
        var users = getUsers();
        var user = null;
        for (var i = 0; i < users.length; i++) {
          var u = users[i];
          var matchUser = (String(u.username).toLowerCase() === username.toLowerCase()) ||
                          (String(u.email).toLowerCase() === username.toLowerCase());
          if (matchUser && u.password === password) {
            user = u;
            break;
          }
        }
        if (!user) return { success: false, message: 'Invalid username or password. Please check your username and password' };

        var session = {
          id: user.id,
          username: user.username,
          email: user.email,
          name: user.name,
          role: user.role,
          loginAt: new Date().toISOString()
        };
        try {
          localStorage.setItem(PREFIX + 'currentUser', JSON.stringify(session));
          if (remember) localStorage.setItem(PREFIX + 'remember', 'true');
          else localStorage.removeItem(PREFIX + 'remember');
        } catch (e) {
          return { success: false, message: 'Cannot save session. Check browser storage settings.' };
        }
        recordLoginHistory(session);
        return { success: true, user: session };
      }

      // Already logged in?
      try {
        var existing = localStorage.getItem(PREFIX + 'currentUser');
        if (existing) {
          window.location.href = 'dashboard.html';
          return;
        }
      } catch (e) {}

      // Seed users
      getUsers();

      // Toggle password
      document.getElementById('togglePassword').addEventListener('click', function () {
        var input = document.getElementById('password');
        var icon = this.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          if (icon) { icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); }
        } else {
          input.type = 'password';
          if (icon) { icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); }
        }
      });

      document.getElementById('forgotPassword').addEventListener('click', function (e) {
        e.preventDefault();
        window.open('https://wa.me/923267029939?text=Login%20help%20chahiye', '_blank');
      });

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        hideMessages();

        var username = (document.getElementById('username').value || '').trim();
        var password = document.getElementById('password').value || '';
        var remember = document.getElementById('rememberMe').checked;
        var btn = document.getElementById('loginBtn');

        if (!username) {
          showError('Please enter username.');
          document.getElementById('username').focus();
          return;
        }
        if (!password) {
          showError('Please enter password.');
          document.getElementById('password').focus();
          return;
        }

        btn.disabled = true;
        btn.innerHTML = 'Logging in...';

        setTimeout(function () {
          var result = doLogin(username, password, remember);
          if (result.success) {
            showSuccess('Login successful! Redirecting...');
            setTimeout(function () {
              window.location.href = 'dashboard.html';
            }, 400);
          } else {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
            showError(result.message);
          }
        }, 250);
      });
    })();
  </script>

  <a id="whatsappFloat" class="whatsapp-float" href="https://wa.me/923267029939?text=Assalamualaikum%2C%20Al%20Bilawal%20Soomro%20Public%20School" target="_blank" rel="noopener noreferrer" title="WhatsApp: 0326-7029939" aria-label="Chat on WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script>
    (function() {
      try {
        var logo = localStorage.getItem('smps_schoolLogo');
        var el = document.getElementById('loginLogo');
        if (!el) return;
        if (logo === '') {
          el.style.display = 'none';
        } else if (logo) {
          el.src = logo;
        }
      } catch (e) {}
    })();
  </script>

</body>
</html>
