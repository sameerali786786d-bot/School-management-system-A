<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fees - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
  <link href="css/print.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div><h1>Fee Management</h1><p class="text-muted mb-0 small">Collect fees and view payment history</p></div>
          <button class="btn btn-primary btn-sm" id="btnCollectFee"><i class="fas fa-plus me-1"></i>Collect Fee</button>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-4"><div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h3 id="feeCollected">0</h3><p>Total Collected</p></div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="stat-icon orange"><i class="fas fa-clock"></i></div><div class="stat-info"><h3 id="feePending">0</h3><p>Total Pending</p></div></div></div>
          <div class="col-md-4"><div class="stat-card"><div class="stat-icon blue"><i class="fas fa-receipt"></i></div><div class="stat-info"><h3 id="feeCount">0</h3><p>Transactions</p></div></div></div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-3"><input type="search" class="form-control" id="searchFee" placeholder="Search student..."></div>
              <div class="col-md-2"><select class="form-select" id="filterFeeStatus"><option value="">All Status</option><option value="paid">Paid</option><option value="pending">Pending</option></select></div>
              <div class="col-md-2"><button class="btn btn-outline-secondary btn-sm" id="exportFees"><i class="fas fa-download me-1"></i>Export</button></div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>Invoice</th><th>Student</th><th>Class</th><th>Month</th><th>Amount</th><th>Paid</th><th>Remaining</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="feesBody"></tbody>
              </table>
            </div>
            <div id="feesEmpty" class="empty-state d-none"><i class="fas fa-money-bill-wave"></i><h5>No fee records</h5></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="feeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Collect Fee</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="feeForm">
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Student *</label>
              <select class="form-select" id="feeStudent" required></select></div>
            <div class="row g-2">
              <div class="col-6"><label class="form-label">Month *</label>
                <select class="form-select" id="feeMonth" required>
                  <option>January</option><option>February</option><option>March</option><option>April</option>
                  <option>May</option><option>June</option><option>July</option><option>August</option>
                  <option>September</option><option>October</option><option>November</option><option>December</option>
                </select></div>
              <div class="col-6"><label class="form-label">Fee Type</label>
                <select class="form-select" id="feeType"><option>Tuition Fee</option><option>Admission Fee</option><option>Exam Fee</option><option>Transport Fee</option><option>Other</option></select></div>
              <div class="col-6"><label class="form-label">Amount *</label><input type="number" class="form-control" id="feeAmount" required min="1"></div>
              <div class="col-6"><label class="form-label">Discount</label><input type="number" class="form-control" id="feeDiscount" value="0" min="0"></div>
              <div class="col-6"><label class="form-label">Paid Amount *</label><input type="number" class="form-control" id="feePaid" required min="0"></div>
              <div class="col-6"><label class="form-label">Payment Method</label>
                <select class="form-select" id="feeMethod"><option>Cash</option><option>Bank Transfer</option><option>Online</option></select></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Collect & Generate Receipt</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="receiptModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Fee Receipt</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="receiptBody"></div>
        <div class="modal-footer no-print">
          <button class="btn btn-outline-secondary" onclick="window.print()"><i class="fas fa-print me-1"></i>Print</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script><script src="js/app.js"></script><script src="js/fees.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{App.init();App.ensureConfirmModal();Fees.init();});</script>
</body>
</html>
