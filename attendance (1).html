<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance - THE SMART MODERN PUBLIC SCHOOL QAMBER</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div><h1>Student Attendance</h1><p class="text-muted mb-0 small">Mark and manage daily attendance</p></div>
        </div>
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-3"><label class="form-label">Date</label><input type="date" class="form-control" id="attDate"></div>
              <div class="col-md-3"><label class="form-label">Class</label><select class="form-select" id="attClass"></select></div>
              <div class="col-md-2"><label class="form-label">Section</label><select class="form-select" id="attSection"></select></div>
              <div class="col-md-4">
                <button class="btn btn-primary me-1" id="loadStudents"><i class="fas fa-search me-1"></i>Load</button>
                <button class="btn btn-success btn-sm" id="markAllPresent">All Present</button>
                <button class="btn btn-danger btn-sm" id="markAllAbsent">All Absent</button>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header d-flex justify-content-between">
            <span>Students</span>
            <button class="btn btn-primary btn-sm" id="saveAttendance" disabled><i class="fas fa-save me-1"></i>Save Attendance</button>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle"><thead><tr><th>#</th><th>Name</th><th>Roll</th><th>Status</th></tr></thead><tbody id="attBody"></tbody></table>
            </div>
            <div id="attEmpty" class="empty-state"><i class="fas fa-calendar-check"></i><h5>Select class and load students</h5></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script><script src="js/app.js"></script><script src="js/attendance.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{App.init();Attendance.init();});</script>
</body>
</html>
