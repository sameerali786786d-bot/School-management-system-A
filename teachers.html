<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers - Al Bilawal Soomro Public School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">

  <style>
    .id-card-set { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; padding: 8px; }
    .tid-card {
      width: 280px; height: 450px; border-radius: 14px; overflow: hidden;
      box-shadow: 0 12px 36px rgba(37, 99, 235, .22);
      font-family: Inter, system-ui, sans-serif; position: relative;
      background: #fff;
    }
    /* FRONT */
    .tid2-front {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      background: #1e3a8a; position: relative; overflow: hidden;
    }
    .tid2-front-top {
      height: 46%; background: #bfdbfe; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding-top: 8px;
    }
    .tid2-blob1 {
      position: absolute; top: -40px; left: -30px;
      width: 140px; height: 140px; border-radius: 50%;
      background: #93c5fd; opacity: .7;
    }
    .tid2-blob2 {
      position: absolute; top: 10px; right: -45px;
      width: 150px; height: 150px; border-radius: 50%;
      background: #3b82f6; opacity: .35;
    }
    .tid2-logo-sm {
      width: 36px; height: 36px; border-radius: 8px; object-fit: cover;
      background: #fff; z-index: 2; margin-bottom: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .tid2-photo {
      width: 118px; height: 118px; border-radius: 50%;
      border: 5px solid #fff; overflow: hidden; background: #e2e8f0;
      box-shadow: 0 8px 24px rgba(30, 58, 138, .25);
      z-index: 2; display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 800; color: #1e3a8a;
    }
    .tid2-photo img { width: 100%; height: 100%; object-fit: cover; }
    .tid2-front-bottom {
      flex: 1; background: #1e3a8a; color: #fff;
      padding: 18px 16px 14px; text-align: center; position: relative;
    }
    .tid2-dots {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: rgba(147, 197, 253, .45);
    }
    .tid2-name {
      font-size: 1.2rem; font-weight: 800; margin-bottom: 2px;
    }
    .tid2-role {
      font-size: 0.85rem; color: #93c5fd; margin-bottom: 12px; font-weight: 500;
    }
    .tid2-info {
      text-align: left; font-size: 0.75rem; line-height: 1.75;
      color: #e0e7ff; max-width: 230px; margin: 0 auto;
    }
    .tid2-info i { width: 16px; color: #93c5fd; margin-right: 6px; }
    /* BACK */
    .tid2-back {
      width: 100%; height: 100%; background: #bfdbfe;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 22px 18px 16px; text-align: center;
    }
    .tid2-back-blob1 {
      position: absolute; top: -30px; right: -40px;
      width: 130px; height: 130px; border-radius: 50%;
      background: #3b82f6; opacity: .4;
    }
    .tid2-back-blob2 {
      position: absolute; bottom: -20px; left: -30px;
      width: 120px; height: 120px; border-radius: 40% 60%;
      background: #1e3a8a; opacity: .25;
    }
    .tid2-back-logo {
      width: 56px; height: 56px; border-radius: 12px; object-fit: cover;
      background: #fff; z-index: 1; margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(30,58,138,.2);
    }
    .tid2-back-school {
      font-size: 0.95rem; font-weight: 800; color: #1e3a8a;
      text-transform: uppercase; letter-spacing: .03em; z-index: 1;
      line-height: 1.25; margin-bottom: 10px;
    }
    .tid2-back-dates {
      font-size: 0.75rem; color: #1e40af; z-index: 1; margin-bottom: 6px;
      font-weight: 600;
    }
    .tid2-back-dates span { display: block; margin-bottom: 2px; }
    .tid2-back-note {
      font-size: 0.6rem; color: #64748b; max-width: 210px;
      margin: 0 auto 12px; z-index: 1; line-height: 1.4;
    }
    .tid2-qr {
      background: #fff; padding: 10px; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(30, 58, 138, .15);
      z-index: 1;
    }
    .tid2-qr canvas, .tid2-qr img {
      display: block; width: 115px !important; height: 115px !important;
    }
    .tid2-grid {
      position: absolute; bottom: 14px; right: 14px;
      width: 36px; height: 36px; opacity: .25;
      background-image: linear-gradient(#1e3a8a 1px, transparent 1px),
        linear-gradient(90deg, #1e3a8a 1px, transparent 1px);
      background-size: 9px 9px;
    }
    .sid-label-tag {
      position: absolute; top: 8px; left: 8px; z-index: 5;
      background: rgba(30,58,138,.7); color: #fff; font-size: 0.55rem;
      padding: 2px 7px; border-radius: 6px;
    }
    @media print {
      body * { visibility: hidden !important; }
      #teacherIdCardModal, #teacherIdCardModal * { visibility: visible !important; }
      #teacherIdCardModal { position: fixed; left: 0; top: 0; }
      .modal-backdrop, .no-print { display: none !important; }
      .modal { position: static !important; }
      .modal-dialog { max-width: none !important; margin: 0 !important; }
      .modal-content { border: none !important; box-shadow: none !important; }
      .tid-card { box-shadow: none; border: 1px solid #cbd5e1; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div><h1>Teachers</h1><p class="text-muted mb-0 small">Manage teaching staff</p></div>
          <button class="btn btn-primary btn-sm" id="btnAddTeacher"><i class="fas fa-plus me-1"></i>Add Teacher</button>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-4"><input type="search" class="form-control" id="searchTeacher" placeholder="Search teachers..."></div>
              <div class="col-md-3">
                <select class="form-select" id="filterStatus"><option value="">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>Name</th><th>Designation</th><th>Phone</th><th>Email</th><th>Joining</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="teachersBody"></tbody>
              </table>
            </div>
            <div id="teachersEmpty" class="empty-state d-none"><i class="fas fa-chalkboard-teacher"></i><h5>No teachers found</h5></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="teacherModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="teacherModalTitle">Add Teacher</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="teacherForm">
          <div class="modal-body">
            <input type="hidden" id="teacherId">
            <div class="row g-3">
              <div class="col-12">
                <div class="border rounded p-3 bg-light mb-1">
                  <label class="form-label fw-semibold mb-2"><i class="fas fa-camera me-1 text-primary"></i> Teacher Photo (ID Card)</label>
                  <div class="d-flex flex-wrap align-items-center gap-3">
                    <img id="teacherPhotoPreview" alt="Preview" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid #0b3a6e;display:none;background:#fff;">
                    <div class="flex-grow-1" style="min-width:180px;">
                      <input type="file" class="form-control" id="teacherPhoto" accept="image/*">
                      <div class="form-text">JPG/PNG — ID card aur QR scan pe dikhegi</div>
                      <button type="button" class="btn btn-sm btn-outline-danger mt-1" id="clearTeacherPhoto" style="display:none;"><i class="fas fa-trash me-1"></i>Remove Photo</button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-md-6"><label class="form-label">Full Name *</label><input type="text" class="form-control" id="tName" required></div>
              <div class="col-md-6"><label class="form-label">Father's Name</label><input type="text" class="form-control" id="tFather"></div>
              <div class="col-md-4"><label class="form-label">Gender *</label><select class="form-select" id="tGender" required><option value="">Select</option><option>Male</option><option>Female</option></select></div>
              <div class="col-md-4"><label class="form-label">Date of Birth</label><input type="date" class="form-control" id="tDob"></div>
              <div class="col-md-4"><label class="form-label">Phone *</label><input type="tel" class="form-control" id="tPhone" required></div>
              <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="tEmail"></div>
              <div class="col-md-6"><label class="form-label">Designation *</label><input type="text" class="form-control" id="tDesignation" required></div>
              <div class="col-md-6"><label class="form-label">Qualification</label><input type="text" class="form-control" id="tQualification"></div>
              <div class="col-md-3"><label class="form-label">Experience (yrs)</label><input type="number" class="form-control" id="tExperience" min="0"></div>
              <div class="col-md-3"><label class="form-label">Salary</label><input type="number" class="form-control" id="tSalary" min="0"></div>
              <div class="col-md-6"><label class="form-label">Joining Date</label><input type="date" class="form-control" id="tJoining"></div>
              <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" id="tStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
              <div class="col-12"><label class="form-label">Address</label><input type="text" class="form-control" id="tAddress"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <!-- Teacher ID Card Modal -->
  <div class="modal fade" id="teacherIdCardModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header no-print">
          <h5 class="modal-title">Teacher ID Card</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body d-flex justify-content-center" id="teacherIdCardBody"></div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-outline-primary" id="printTeacherIdCard"><i class="fas fa-print me-1"></i>Print</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/teachers.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{App.init();App.ensureConfirmModal();Teachers.init();});</script>
</body>
</html>
